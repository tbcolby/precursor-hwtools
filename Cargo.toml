[package]
name = "hwtools"
version = "0.1.0"
edition = "2021"
description = "Hardware diagnostic Swiss army knife for Precursor"

[dependencies]
# Core Xous
xous = "0.9.69"
xous-ipc = "0.10.9"
log = "0.4.14"
log-server = { package = "xous-api-log", version = "0.1.68" }
xous-names = { package = "xous-api-names", version = "0.9.70" }

# Graphics (access all types through gam re-exports)
gam = { path = "../../services/gam" }

# Timing
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.68" }

# Enum serialization
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }

# Hardware access
llio = { path = "../../services/llio" }
com = { path = "../../services/com" }

# Settings storage
pddb = { path = "../../services/pddb" }

# Version info
xous-semver = "0.1.5"
